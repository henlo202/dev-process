name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate process structure, links and version
        run: python tooling/validate.py
      - name: Guardrail tests (real git repos)
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          python -m unittest discover -s tooling/tests -v
      - name: Smoke-test scaffolder and checker
        run: |
          python tooling/scaffold.py "$RUNNER_TEMP/demo" --name demo --tier T3 --github --adapter claude --guardrails block
          python "$RUNNER_TEMP/demo/.process/check.py" --project "$RUNNER_TEMP/demo"
      - name: Worked example tests and conformance
        working-directory: examples/greeter-cli
        run: |
          python -m unittest discover -s tests
          diff -q ../../tooling/check.py .process/check.py
          diff -q ../../tooling/guardrails/guard.py .process/guardrails/guard.py
          diff -q ../../tooling/status.py .process/status.py
          python .process/status.py
          pip install ruff
          python .process/guardrails/guard.py ci
          python .process/check.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build site
        run: python site/build.py
      # Download from the run's Artifacts section and open index.html locally.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Optional: publishing to GitHub Pages runs only when the repository variable
  # PAGES_ENABLED is "true" (Settings > Secrets and variables > Actions > Variables)
  # and Pages is enabled with source "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
