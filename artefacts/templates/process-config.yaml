# Links this project to dev-process. Read by .process/check.py and by agents.
process_version: "{{process_version}}"
project: "{{project}}"
tier: {{tier}}            # T1 | T2 | T3: highest tier of work currently expected
test_paths:               # where to look for requirement IDs referenced by tests
  - tests
increment_limits:         # size limit per increment (warn only)
  max_requirements: 5
  max_slices: 8
guardrails:               # hard enforcement; see dev-process guides/guardrails.md
  mode: {{guardrails_mode}}               # block | warn
  protected_branches: [main, master]
  branch_pattern: '^(task|fix|spike|docs|chore|release)/[A-Za-z0-9._/-]+$'
  commit_pattern: '^(feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert|spike)(\([^)]+\))?!?: .+'
  lint_command: ""        # e.g. "ruff check . && ruff format --check ."
  agent_blocked_commands: []   # regexes agent adapters refuse, e.g. deploy commands
waivers: []
# waivers:
#   - rule: artefact-missing:runbook       # rule id as printed by the checker
#     reason: CLI tool with no runtime; release procedure is in CONTRIBUTING.md
#     expires: 2027-06-30
