# Structural index of the development process.
# This file is the machine-readable source of truth for how phases, gates,
# artefacts, roles and risk tiers relate. Prose lives in the linked Markdown
# files. Validated against schema/process.schema.json.

process:
  name: dev-process
  version: 0.6.0
  language: en
  owner: Owner
  summary: >
    A standard, tool-neutral process for AI-agentic software development,
    run by a single human Owner with AI agents doing most of the work and
    human approval at defined gates.

tiers:
  - id: T1
    name: Trivial
    doc: guides/risk-tiers.md
    summary: Small, low-risk change inside an existing initiative (bug fix, copy change, dependency bump). Skips shaping.
  - id: T2
    name: Standard
    doc: guides/risk-tiers.md
    summary: A normal increment with a clear outcome and limited blast radius.
  - id: T3
    name: Major
    doc: guides/risk-tiers.md
    summary: New architecture, security-sensitive work, data migrations or anything hard to reverse. Adds design scrutiny at G1.

# Model classes: abstract capability levels. Each project maps them to concrete
# models in .process/config.yaml (economy.models), so the process stays tool- and
# model-neutral. Roles and task skills name a default class; tier_model_class
# overrides it for work of a given tier. See guides/resource-economy.md.
model_classes:
  - id: deep
    name: Deep
    effort: high
    doc: guides/resource-economy.md
    summary: The most capable model. Design choices, trade-offs, judging risk, hard debugging, T3 reviews.
  - id: standard
    name: Standard
    effort: medium
    doc: guides/resource-economy.md
    summary: A mid-tier model. Code, tests, requirements and reviews against a clear brief.
  - id: fast
    name: Fast
    effort: low
    doc: guides/resource-economy.md
    summary: A small, cheap model. Mechanical work such as doc edits, changelogs, formatting, summaries and running scripts.

roles:
  - id: owner
    name: Owner
    kind: human
    doc: roles/roles.md
    summary: Sets direction, approves every gate, owns the process.
  - id: orchestrator
    name: Orchestrator agent
    kind: agent
    doc: roles/roles.md
    summary: Runs the process. Works out the next step from the repository, delegates it to the right role, and stops only at gates.
    model_class: standard
  - id: analyst
    name: Analyst agent
    kind: agent
    doc: roles/roles.md
    summary: Elicits and writes requirements and acceptance criteria while shaping an increment.
    model_class: standard
    tier_model_class: {T3: deep}
  - id: architect
    name: Architect agent
    kind: agent
    doc: roles/roles.md
    summary: Shapes the "how" of an increment, runs design spikes, writes ADRs and the test strategy.
    model_class: deep
  - id: planner
    name: Planner agent
    kind: agent
    doc: roles/roles.md
    summary: Keeps increments small and writes the increment brief with its task slices.
    model_class: standard
  - id: implementer
    name: Implementer agent
    kind: agent
    doc: roles/roles.md
    summary: Writes code and tests test-first, runs throwaway spikes, and records demos.
    model_class: standard
    tier_model_class: {T1: fast}
  - id: tester
    name: Tester agent
    kind: agent
    doc: roles/roles.md
    summary: Derives tests from acceptance criteria and hunts for gaps.
    model_class: standard
    tier_model_class: {T1: fast}
  - id: reviewer
    name: Reviewer agent
    kind: agent
    doc: roles/roles.md
    summary: Critiques artefacts and code before every human gate.
    model_class: standard
    tier_model_class: {T3: deep}
  - id: documenter
    name: Documenter agent
    kind: agent
    doc: roles/roles.md
    summary: Keeps technical, operational and user documentation current.
    model_class: fast
    tier_model_class: {T3: standard}

# The process is a loop: P0 runs once per initiative, then every change runs
# through the increment loop P1..P5 and back to P1 (T1 changes enter at P2).
phases:
  - id: P0
    name: Initiate
    doc: phases/P0-initiate.md
    once_per_initiative: true
    loop: false
    tiers: [T1, T2, T3]
    roles: [owner, analyst, architect]
    inputs: []
    outputs: [brief, agents-context, process-config, standards, architecture, test-strategy]
    gate: G0
  - id: P1
    name: Shape
    doc: phases/P1-shape.md
    loop: true
    tiers: [T2, T3]
    roles: [owner, analyst, architect, planner, reviewer]
    inputs: [brief, requirements, architecture, retrospective]
    outputs: [increment, requirements, spike-report, architecture, adr, test-strategy, risk-register]
    gate: G1
  - id: P2
    name: Build
    doc: phases/P2-build.md
    loop: true
    tiers: [T1, T2, T3]
    roles: [implementer, tester, documenter]
    inputs: [increment, requirements, architecture, test-strategy, standards, agents-context]
    outputs: [code, tests, user-docs, changelog]
    gate: null
  - id: P3
    name: Verify
    doc: phases/P3-verify.md
    loop: true
    tiers: [T1, T2, T3]
    roles: [owner, tester, reviewer]
    inputs: [code, tests, requirements, increment]
    outputs: [traceability-report, conformance-report, demo]
    gate: G2
  - id: P4
    name: Release
    doc: phases/P4-release.md
    loop: true
    tiers: [T1, T2, T3]
    roles: [owner, documenter, reviewer]
    inputs: [changelog, runbook, user-docs, traceability-report]
    outputs: [release-notes, runbook]
    gate: G3
  - id: P5
    name: Learn
    doc: phases/P5-learn.md
    loop: true
    tiers: [T2, T3]
    roles: [owner, documenter]
    inputs: [runbook, increment]
    outputs: [retrospective]
    gate: null

gates:
  - id: G0
    name: Go / No-go
    doc: gates/G0-go-no-go.md
    after: P0
    approver: owner
    once_per_initiative: true
    tiers: [T1, T2, T3]
    evidence: [brief, reviewer-summary]
  - id: G1
    name: Shape approved
    doc: gates/G1-shape.md
    after: P1
    approver: owner
    tiers: [T2, T3]
    evidence: [increment, requirements, reviewer-summary]
    tier_evidence:
      T3: [architecture, adr, test-strategy, risk-register]
  - id: G2
    name: Merge approved
    doc: gates/G2-merge.md
    after: P3
    approver: owner
    tiers: [T1, T2, T3]
    evidence: [demo, traceability-report, conformance-report]
    tier_evidence:
      T2: [reviewer-summary]
      T3: [reviewer-summary]
  - id: G3
    name: Release approved
    doc: gates/G3-release.md
    after: P4
    approver: owner
    tiers: [T1, T2, T3]
    evidence: [release-notes, runbook, reviewer-summary]

# scope: initiative = one living instance per project, kept current.
#        increment  = produced per change / feature.
#        generated  = produced by tooling, never edited by hand.
# required_tiers: tiers for which the conformance checker expects the artefact.
artefacts:
  - id: brief
    name: Initiative brief
    doc: artefacts/brief.md
    template: artefacts/templates/brief.md
    path: docs/brief.md
    scope: initiative
    owner: owner
    required_tiers: [T1, T2, T3]
  - id: agents-context
    name: Agent context file
    doc: artefacts/agents-context.md
    template: artefacts/templates/AGENTS.md
    path: AGENTS.md
    scope: initiative
    owner: owner
    required_tiers: [T1, T2, T3]
  - id: process-config
    name: Process configuration
    doc: artefacts/process-config.md
    template: artefacts/templates/process-config.yaml
    path: .process/config.yaml
    scope: initiative
    owner: owner
    required_tiers: [T1, T2, T3]
  - id: standards
    name: Engineering standards
    doc: artefacts/standards.md
    template: artefacts/templates/standards.md
    path: docs/standards.md
    scope: initiative
    owner: owner
    required_tiers: [T2, T3]
  - id: requirements
    name: Requirements specification
    doc: artefacts/requirements.md
    template: artefacts/templates/requirements.md
    path: docs/requirements/
    scope: initiative
    owner: analyst
    required_tiers: [T2, T3]
  - id: architecture
    name: Architecture document
    doc: artefacts/architecture.md
    template: artefacts/templates/architecture.md
    path: docs/architecture.md
    scope: initiative
    owner: architect
    required_tiers: [T2, T3]
  - id: adr
    name: Architecture decision records
    doc: artefacts/adr.md
    template: artefacts/templates/adr.md
    path: docs/adr/
    scope: increment
    owner: architect
    required_tiers: [T3]
  - id: test-strategy
    name: Test strategy
    doc: artefacts/test-strategy.md
    template: artefacts/templates/test-strategy.md
    path: docs/test-strategy.md
    scope: initiative
    owner: architect
    required_tiers: [T2, T3]
  - id: risk-register
    name: Risk register & threat model
    doc: artefacts/risk-register.md
    template: artefacts/templates/risk-register.md
    path: docs/risks.md
    scope: initiative
    owner: architect
    required_tiers: [T3]
  - id: increment
    name: Increment brief
    doc: artefacts/increment.md
    template: artefacts/templates/increment.md
    path: docs/increments/
    scope: increment
    owner: planner
    required_tiers: [T2, T3]
  - id: spike-report
    name: Spike report
    doc: artefacts/spike-report.md
    template: artefacts/templates/spike-report.md
    path: docs/spikes/
    scope: increment
    owner: implementer
    required_tiers: []
  - id: demo
    name: Increment demo
    doc: artefacts/demo.md
    template: null
    path: null
    scope: increment
    owner: implementer
    required_tiers: []
  - id: code
    name: Source code
    doc: artefacts/code-and-tests.md
    template: null
    path: null
    scope: increment
    owner: implementer
    required_tiers: []
  - id: tests
    name: Automated tests
    doc: artefacts/code-and-tests.md
    template: null
    path: null
    scope: increment
    owner: tester
    required_tiers: [T1, T2, T3]
  - id: traceability-report
    name: Traceability report
    doc: artefacts/traceability-report.md
    template: null
    path: null
    scope: generated
    owner: tester
    required_tiers: []
  - id: conformance-report
    name: Conformance report
    doc: artefacts/conformance-report.md
    template: null
    path: null
    scope: generated
    owner: reviewer
    required_tiers: []
  - id: reviewer-summary
    name: Reviewer summary
    doc: artefacts/reviewer-summary.md
    template: artefacts/templates/reviewer-summary.md
    path: docs/reviews/
    scope: increment
    owner: reviewer
    required_tiers: []
  - id: gate-record
    name: Gate record
    doc: artefacts/gate-record.md
    template: artefacts/templates/gate-record.md
    path: docs/gates/
    scope: increment
    owner: owner
    required_tiers: [T2, T3]
  - id: changelog
    name: Changelog
    doc: artefacts/changelog.md
    template: artefacts/templates/CHANGELOG.md
    path: CHANGELOG.md
    scope: initiative
    owner: documenter
    required_tiers: [T1, T2, T3]
  - id: release-notes
    name: Release notes
    doc: artefacts/changelog.md
    template: null
    path: null
    scope: increment
    owner: documenter
    required_tiers: []
  - id: runbook
    name: Runbook
    doc: artefacts/runbook.md
    template: artefacts/templates/runbook.md
    path: docs/ops/runbook.md
    scope: initiative
    owner: documenter
    required_tiers: [T2, T3]
  - id: user-docs
    name: User documentation
    doc: artefacts/user-docs.md
    template: artefacts/templates/user-docs-index.md
    path: docs/user/
    scope: initiative
    owner: documenter
    required_tiers: [T2, T3]
  - id: retrospective
    name: Retrospective
    doc: artefacts/retrospective.md
    template: artefacts/templates/retrospective.md
    path: docs/retro/
    scope: increment
    owner: owner
    required_tiers: []

# Agent skills (Agent Skills format: <dir>/SKILL.md with name + description).
# kind: role = one per agent role; task = a job the Owner asks for directly.
# bundle: templates copied into the skill folder when installed in a project.
skills:
  - {id: dev-process-orchestrator, kind: role, role: orchestrator, doc: agents/skills/dev-process-orchestrator/SKILL.md, phases: [P0, P1, P2, P3, P4, P5], bundle: []}
  - {id: dev-process-analyst, kind: role, role: analyst, doc: agents/skills/dev-process-analyst/SKILL.md, phases: [P0, P1], bundle: [artefacts/templates/requirements.md]}
  - {id: dev-process-architect, kind: role, role: architect, doc: agents/skills/dev-process-architect/SKILL.md, phases: [P0, P1], bundle: [artefacts/templates/adr.md]}
  - {id: dev-process-planner, kind: role, role: planner, doc: agents/skills/dev-process-planner/SKILL.md, phases: [P0, P1], bundle: [artefacts/templates/increment.md]}
  - {id: dev-process-implementer, kind: role, role: implementer, doc: agents/skills/dev-process-implementer/SKILL.md, phases: [P2, P3], bundle: [artefacts/templates/pull-request.md]}
  - {id: dev-process-tester, kind: role, role: tester, doc: agents/skills/dev-process-tester/SKILL.md, phases: [P2, P3], bundle: []}
  - {id: dev-process-reviewer, kind: role, role: reviewer, doc: agents/skills/dev-process-reviewer/SKILL.md, phases: [P0, P1, P3, P4], bundle: [artefacts/templates/reviewer-summary.md]}
  - {id: dev-process-documenter, kind: role, role: documenter, doc: agents/skills/dev-process-documenter/SKILL.md, phases: [P2, P4, P5], bundle: []}
  - {id: dev-process-shape-increment, kind: task, role: null, model_class: standard, tier_model_class: {T3: deep}, doc: agents/skills/dev-process-shape-increment/SKILL.md, phases: [P1], bundle: [artefacts/templates/increment.md]}
  - {id: dev-process-spike, kind: task, role: null, model_class: standard, doc: agents/skills/dev-process-spike/SKILL.md, phases: [P0, P1, P2], bundle: [artefacts/templates/spike-report.md]}
  - {id: dev-process-demo, kind: task, role: null, model_class: fast, doc: agents/skills/dev-process-demo/SKILL.md, phases: [P3], bundle: []}
  - {id: dev-process-conformance-check, kind: task, role: null, model_class: fast, doc: agents/skills/dev-process-conformance-check/SKILL.md, phases: [P1, P3, P4], bundle: []}

guides:
  - {id: orchestration, name: Running the process day to day, doc: guides/orchestration.md}
  - {id: increments, name: Increments & the loop, doc: guides/increments.md}
  - {id: spikes, name: Spikes (build to learn), doc: guides/spikes.md}
  - {id: guardrails, name: Guardrails (enforcement), doc: guides/guardrails.md}
  - {id: resource-economy, name: Resource economy, doc: guides/resource-economy.md}
  - {id: risk-tiers, name: Risk tiers, doc: guides/risk-tiers.md}
  - {id: requirements-guide, name: Requirements handling, doc: guides/requirements.md}
  - {id: quality-assurance, name: Quality assurance & testing, doc: guides/quality-assurance.md}
  - {id: documentation, name: Documentation, doc: guides/documentation.md}
  - {id: security, name: Security & privacy, doc: guides/security.md}
  - {id: ready-done, name: Definition of Ready & Done, doc: guides/definition-of-ready-done.md}
  - {id: agent-autonomy, name: Agent autonomy levels, doc: guides/agent-autonomy.md}
  - {id: compliance, name: Compliance profiles (future), doc: guides/compliance.md}
  - {id: glossary, name: Glossary, doc: guides/glossary.md}

governance:
  - {id: ownership, name: Ownership, doc: governance/ownership.md}
  - {id: change-process, name: Changing the process, doc: governance/change-process.md}
  - {id: versioning, name: Versioning, doc: governance/versioning.md}
  - {id: adoption, name: Adoption & upgrades, doc: governance/adoption.md}
  - {id: waivers, name: Waivers & deviations, doc: governance/waivers.md}
  - {id: review-cadence, name: Review cadence, doc: governance/review-cadence.md}
