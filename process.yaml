# Structural index of the development process.
# This file is the machine-readable source of truth for how phases, gates,
# artefacts, roles and risk tiers relate. Prose lives in the linked Markdown
# files. Validated against schema/process.schema.json.

process:
  name: dev-process
  version: 0.1.0
  language: en
  owner: Owner
  summary: >
    A standard, tool-neutral process for AI-agentic software development,
    run by a single human Owner with AI agents doing most of the work and
    human approval at defined gates.

tiers:
  - id: T1
    name: Trivial
    doc: guides/risk-tiers.md
    summary: Small, low-risk change inside an existing initiative (bug fix, copy change, dependency bump).
  - id: T2
    name: Standard
    doc: guides/risk-tiers.md
    summary: A normal feature or change with a clear scope and limited blast radius.
  - id: T3
    name: Major
    doc: guides/risk-tiers.md
    summary: New initiative, new architecture, security-sensitive work, data migrations or anything hard to reverse.

roles:
  - id: owner
    name: Owner
    kind: human
    doc: roles/roles.md
    summary: Sets direction, approves every gate, owns the process.
  - id: analyst
    name: Analyst agent
    kind: agent
    doc: roles/roles.md
    summary: Elicits and writes requirements and acceptance criteria.
  - id: architect
    name: Architect agent
    kind: agent
    doc: roles/roles.md
    summary: Proposes architecture, writes ADRs and the test strategy.
  - id: planner
    name: Planner agent
    kind: agent
    doc: roles/roles.md
    summary: Breaks work into small, traceable tasks.
  - id: implementer
    name: Implementer agent
    kind: agent
    doc: roles/roles.md
    summary: Writes code and tests, test-first, on a branch.
  - id: tester
    name: Tester agent
    kind: agent
    doc: roles/roles.md
    summary: Derives tests from acceptance criteria and hunts for gaps.
  - id: reviewer
    name: Reviewer agent
    kind: agent
    doc: roles/roles.md
    summary: Critiques artefacts and code before every human gate.
  - id: documenter
    name: Documenter agent
    kind: agent
    doc: roles/roles.md
    summary: Keeps technical, operational and user documentation current.

phases:
  - id: P0
    name: Initiate
    doc: phases/P0-initiate.md
    once_per_initiative: true
    tiers: [T1, T2, T3]
    roles: [owner, analyst]
    inputs: []
    outputs: [brief, agents-context, process-config]
    gate: G0
  - id: P1
    name: Requirements
    doc: phases/P1-requirements.md
    tiers: [T2, T3]
    roles: [owner, analyst, reviewer]
    inputs: [brief]
    outputs: [requirements]
    gate: G1
  - id: P2
    name: Design
    doc: phases/P2-design.md
    tiers: [T2, T3]
    roles: [owner, architect, reviewer]
    inputs: [brief, requirements]
    outputs: [architecture, adr, test-strategy, risk-register]
    gate: G2
  - id: P3
    name: Plan
    doc: phases/P3-plan.md
    tiers: [T2, T3]
    roles: [owner, planner, reviewer]
    inputs: [requirements, architecture, test-strategy]
    outputs: [plan]
    gate: G3
  - id: P4
    name: Build
    doc: phases/P4-build.md
    tiers: [T1, T2, T3]
    roles: [implementer, tester, documenter]
    inputs: [plan, requirements, architecture, test-strategy, agents-context]
    outputs: [code, tests, user-docs, changelog]
    gate: null
  - id: P5
    name: Verify
    doc: phases/P5-verify.md
    tiers: [T1, T2, T3]
    roles: [owner, tester, reviewer]
    inputs: [code, tests, requirements]
    outputs: [traceability-report, conformance-report]
    gate: G4
  - id: P6
    name: Release
    doc: phases/P6-release.md
    tiers: [T1, T2, T3]
    roles: [owner, documenter, reviewer]
    inputs: [changelog, runbook, user-docs, traceability-report]
    outputs: [release-notes, runbook]
    gate: G5
  - id: P7
    name: Operate & Learn
    doc: phases/P7-operate.md
    tiers: [T2, T3]
    roles: [owner, documenter]
    inputs: [runbook]
    outputs: [retrospective]
    gate: null

gates:
  - id: G0
    name: Go / No-go
    doc: gates/G0-go-no-go.md
    after: P0
    approver: owner
    once_per_initiative: true
    tiers: [T1, T2, T3]
    evidence: [brief, reviewer-summary]
  - id: G1
    name: Requirements approved
    doc: gates/G1-requirements.md
    after: P1
    approver: owner
    tiers: [T2, T3]
    evidence: [requirements, reviewer-summary]
  - id: G2
    name: Design approved
    doc: gates/G2-design.md
    after: P2
    approver: owner
    tiers: [T3]
    evidence: [architecture, adr, test-strategy, risk-register, reviewer-summary]
  - id: G3
    name: Plan approved
    doc: gates/G3-plan.md
    after: P3
    approver: owner
    tiers: [T3]
    evidence: [plan, reviewer-summary]
  - id: G4
    name: Merge approved
    doc: gates/G4-merge.md
    after: P5
    approver: owner
    tiers: [T1, T2, T3]
    evidence: [traceability-report, conformance-report, reviewer-summary]
  - id: G5
    name: Release approved
    doc: gates/G5-release.md
    after: P6
    approver: owner
    tiers: [T1, T2, T3]
    evidence: [release-notes, runbook, reviewer-summary]

# scope: initiative = one living instance per project, kept current.
#        increment  = produced per change / feature.
#        generated  = produced by tooling, never edited by hand.
# required_tiers: tiers for which the conformance checker expects the artefact.
artefacts:
  - id: brief
    name: Initiative brief
    doc: artefacts/brief.md
    template: artefacts/templates/brief.md
    path: docs/brief.md
    scope: initiative
    owner: owner
    required_tiers: [T1, T2, T3]
  - id: agents-context
    name: Agent context file
    doc: artefacts/agents-context.md
    template: artefacts/templates/AGENTS.md
    path: AGENTS.md
    scope: initiative
    owner: owner
    required_tiers: [T1, T2, T3]
  - id: process-config
    name: Process configuration
    doc: artefacts/process-config.md
    template: artefacts/templates/process-config.yaml
    path: .process/config.yaml
    scope: initiative
    owner: owner
    required_tiers: [T1, T2, T3]
  - id: requirements
    name: Requirements specification
    doc: artefacts/requirements.md
    template: artefacts/templates/requirements.md
    path: docs/requirements/
    scope: initiative
    owner: analyst
    required_tiers: [T2, T3]
  - id: architecture
    name: Architecture document
    doc: artefacts/architecture.md
    template: artefacts/templates/architecture.md
    path: docs/architecture.md
    scope: initiative
    owner: architect
    required_tiers: [T2, T3]
  - id: adr
    name: Architecture decision records
    doc: artefacts/adr.md
    template: artefacts/templates/adr.md
    path: docs/adr/
    scope: increment
    owner: architect
    required_tiers: [T3]
  - id: test-strategy
    name: Test strategy
    doc: artefacts/test-strategy.md
    template: artefacts/templates/test-strategy.md
    path: docs/test-strategy.md
    scope: initiative
    owner: architect
    required_tiers: [T2, T3]
  - id: risk-register
    name: Risk register & threat model
    doc: artefacts/risk-register.md
    template: artefacts/templates/risk-register.md
    path: docs/risks.md
    scope: initiative
    owner: architect
    required_tiers: [T3]
  - id: plan
    name: Task plan
    doc: artefacts/plan.md
    template: artefacts/templates/plan.md
    path: docs/plan.md
    scope: increment
    owner: planner
    required_tiers: [T3]
  - id: code
    name: Source code
    doc: artefacts/code-and-tests.md
    template: null
    path: null
    scope: increment
    owner: implementer
    required_tiers: []
  - id: tests
    name: Automated tests
    doc: artefacts/code-and-tests.md
    template: null
    path: null
    scope: increment
    owner: tester
    required_tiers: [T1, T2, T3]
  - id: traceability-report
    name: Traceability report
    doc: artefacts/traceability-report.md
    template: null
    path: null
    scope: generated
    owner: tester
    required_tiers: []
  - id: conformance-report
    name: Conformance report
    doc: artefacts/conformance-report.md
    template: null
    path: null
    scope: generated
    owner: reviewer
    required_tiers: []
  - id: reviewer-summary
    name: Reviewer summary
    doc: artefacts/reviewer-summary.md
    template: artefacts/templates/reviewer-summary.md
    path: null
    scope: increment
    owner: reviewer
    required_tiers: []
  - id: gate-record
    name: Gate record
    doc: artefacts/gate-record.md
    template: artefacts/templates/gate-record.md
    path: docs/gates/
    scope: increment
    owner: owner
    required_tiers: [T2, T3]
  - id: changelog
    name: Changelog
    doc: artefacts/changelog.md
    template: artefacts/templates/CHANGELOG.md
    path: CHANGELOG.md
    scope: initiative
    owner: documenter
    required_tiers: [T1, T2, T3]
  - id: release-notes
    name: Release notes
    doc: artefacts/changelog.md
    template: null
    path: null
    scope: increment
    owner: documenter
    required_tiers: []
  - id: runbook
    name: Runbook
    doc: artefacts/runbook.md
    template: artefacts/templates/runbook.md
    path: docs/ops/runbook.md
    scope: initiative
    owner: documenter
    required_tiers: [T2, T3]
  - id: user-docs
    name: User documentation
    doc: artefacts/user-docs.md
    template: artefacts/templates/user-docs-index.md
    path: docs/user/
    scope: initiative
    owner: documenter
    required_tiers: [T2, T3]
  - id: retrospective
    name: Retrospective
    doc: artefacts/retrospective.md
    template: artefacts/templates/retrospective.md
    path: docs/retro/
    scope: increment
    owner: owner
    required_tiers: []

guides:
  - {id: risk-tiers, name: Risk tiers, doc: guides/risk-tiers.md}
  - {id: requirements-guide, name: Requirements handling, doc: guides/requirements.md}
  - {id: quality-assurance, name: Quality assurance & testing, doc: guides/quality-assurance.md}
  - {id: documentation, name: Documentation, doc: guides/documentation.md}
  - {id: security, name: Security & privacy, doc: guides/security.md}
  - {id: ready-done, name: Definition of Ready & Done, doc: guides/definition-of-ready-done.md}
  - {id: agent-autonomy, name: Agent autonomy levels, doc: guides/agent-autonomy.md}
  - {id: compliance, name: Compliance profiles (future), doc: guides/compliance.md}
  - {id: glossary, name: Glossary, doc: guides/glossary.md}

governance:
  - {id: ownership, name: Ownership, doc: governance/ownership.md}
  - {id: change-process, name: Changing the process, doc: governance/change-process.md}
  - {id: versioning, name: Versioning, doc: governance/versioning.md}
  - {id: adoption, name: Adoption & upgrades, doc: governance/adoption.md}
  - {id: waivers, name: Waivers & deviations, doc: governance/waivers.md}
  - {id: review-cadence, name: Review cadence, doc: governance/review-cadence.md}
