# Links this project to dev-process. Read by .process/check.py and by agents.
process_version: "0.2.0"
project: "greeter-cli"
tier: T2            # T1 | T2 | T3: highest tier of work currently expected
test_paths:               # where to look for requirement IDs referenced by tests
  - tests
increment_limits:         # size limit per increment (warn only)
  max_requirements: 5
  max_slices: 8
waivers:
  - rule: untested-requirement:REQ-004
    reason: AC-004.1 (plain-language help text) is subjective and checked manually at G2.
    expires: 2027-10-19
# More waiver examples:
#   - rule: artefact-missing:runbook       # rule id as printed by the checker
#     reason: CLI tool with no runtime; release procedure is in CONTRIBUTING.md
#     expires: 2027-06-30
